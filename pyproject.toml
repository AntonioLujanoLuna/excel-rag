[project]
name = "excel-rag"
version = "0.1.0"
description = "Structure-aware RAG over Excel workbooks: workbook structure and semantics indexed in Elasticsearch, one stateless retrieval endpoint."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
es = ["elasticsearch>=8.14,<9"]
# In-process embeddings (lightonai/mDenseOn by default). Pulls in torch; for CPU-only hosts install
# torch from https://download.pytorch.org/whl/cpu first to avoid the CUDA wheels.
embed = ["sentence-transformers>=5.4"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
excel-rag = "excel_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/excel_rag"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["excel_rag"]

[tool.coverage.report]
show_missing = true
# The retrieval contract is what callers depend on; untested paths in it are claims.
fail_under = 85
