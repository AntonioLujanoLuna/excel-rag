name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev --extra mcp --extra xlsb
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy src/excel_rag
      - name: Tests
        run: uv run pytest --cov=excel_rag --cov-report=term
      - name: Retrieval quality
        # The hashing embedder and overlap reranker are deterministic stand-ins for the models, so
        # these floors catch a chunking, fusion or ranking change that loses answers -- one case of
        # slack below today's figures. Raise them when ranking improves.
        run: |
          uv run excel-rag evaluate --embedder hashing --rerank overlap --no-misses \
            --min lexical:mrr=0.52 --min lexical:hit@10=0.62 \
            --min hybrid:mrr=0.60 --min hybrid:hit@10=0.68 \
            --min hybrid+rerank:mrr=0.59 --min hybrid+rerank:hit@10=0.75
          uv run excel-rag evaluate --mine --embedder hashing --rerank overlap --no-misses \
            --min hit@3=1.0 --min lexical:mrr=0.62 --min hybrid:mrr=0.79 \
            --min hybrid+rerank:mrr=0.91

  live-elasticsearch:
    # The in-memory double accepts any mapping and refreshes instantly; a real cluster does neither.
    # This job runs tests/live against one, which is where a refused mapping, a rejected bulk item
    # or an unrefreshed delete shows up.
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.ml.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra es
      - name: Live tests
        env:
          EXCEL_RAG_TEST_ES_URL: http://127.0.0.1:9200
        run: uv run pytest tests/live -rs
